<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Ciências da Computação</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="course-page">
    <main class="course-shell" aria-labelledby="course-title">
      <header class="course-header">
        <div class="course-number" aria-label="Curso número 3">3</div>
        <h1 id="course-title">Ciências da Computação</h1>
      </header>

      <section class="unit-list" aria-label="Unidades do curso">
        <article class="unit-card unit-card-network">
          <div class="unit-illustration illustration-network" aria-hidden="true">
            <span class="network-node node-one"></span>
            <span class="network-node node-two"></span>
            <span class="network-node node-three"></span>
            <span class="network-node node-four"></span>
            <span class="network-line line-one"></span>
            <span class="network-line line-two"></span>
            <span class="network-line line-three"></span>
          </div>
          <div class="unit-copy">
            <span class="unit-label">UNIDADE</span>
            <h2>Redes parte 1: conceitos e prática</h2>
          </div>
          <span class="unit-badge" aria-label="Unidade concluída"><span></span></span>
        </article>

        <article class="unit-card unit-card-wifi">
          <div class="unit-illustration illustration-wifi" aria-hidden="true">
            <span class="wifi-antenna"></span>
            <span class="wifi-base"></span>
            <span class="wifi-highlight"></span>
          </div>
          <div class="unit-copy">
            <span class="unit-label">UNIDADE</span>
            <h2>Redes parte 5: Wi-Fi</h2>
          </div>
          <span class="unit-badge" aria-label="Unidade concluída"><span></span></span>
        </article>

        <article class="unit-card unit-card-arduino">
          <div class="unit-illustration illustration-arduino" aria-hidden="true">
            <span class="arduino-disc disc-minus">−</span>
            <span class="arduino-disc disc-plus">+</span>
            <span class="arduino-connector"></span>
          </div>
          <div class="unit-copy">
            <span class="unit-label">UNIDADE</span>
            <h2>Arduino: do zero ao jogo</h2>
          </div>
          <span class="unit-badge" aria-label="Unidade concluída"><span></span></span>
        </article>
      </section>
    </main>
  </body>
</html>
